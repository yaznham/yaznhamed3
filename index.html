<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yazn - روابط التواصل الاجتماعي</title>
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards ease-out;
            position: relative;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            display: block;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05) rotate(3deg);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        p.bio {
            color: #a1a1aa;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 14px;
            border: 1px solid #2a2a2a;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .link-btn i.icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            color: #38bdf8;
            transition: color 0.3s ease;
        }

        .link-btn:hover {
            background: #242424;
            border-color: #38bdf8;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.15);
        }

        .link-btn:hover i.icon {
            color: #7dd3fc;
        }

        .arrow {
            font-size: 0.8rem;
            color: #71717a;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-btn:hover .arrow {
            color: #38bdf8;
            transform: translateX(-4px);
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #38bdf8;
            color: #050505;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
            transition: bottom 0.4s ease;
            z-index: 1000;
        }

        .toast.show {
            bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الصورة الشخصية -->
        <img src="Profile.jpg" alt="yazn" class="profile-img">

        <!-- الاسم والوصف -->
        <h1>yazn</h1>
        <p class="bio" id="greeting">تواصل معي عبر الروابط التالية</p>

        <!-- قائمة الروابط -->
        <div class="links-container">
            <!-- اتصال مباشر -->
            <a href="tel:+201106298595" class="link-btn">
                <i class="fa-solid fa-phone icon"></i>
                <span>اتصال مباشر</span>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </a>

            <!-- نسخ رقم الهاتف -->
            <button class="link-btn" onclick="copyNumber('+201106298595')">
                <i class="fa-regular fa-copy icon"></i>
                <span>نسخ رقم الهاتف</span>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </button>

            <!-- واتساب -->
            <a href="https://api.whatsapp.com/send?phone=201106298595" target="_blank" class="link-btn">
                <i class="fa-brands fa-whatsapp icon"></i>
                <span>واتساب</span>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </a>

            <!-- انستجرام -->
            <a href="https://www.instagram.com/yznhmd835" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram icon"></i>
                <span>انستجرام</span>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </a>

            <!-- مشاركة الكارت -->
            <button class="link-btn" onclick="shareProfile()">
                <i class="fa-solid fa-share-nodes icon"></i>
                <span>مشاركة الكارت</span>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </button>
        </div>
    </div>

    <!-- إشعار النسخ -->
    <div id="toast" class="toast">تم نسخ الرقم بنجاح! 📋</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const greetingElement = document.getElementById('greeting');
            const hour = new Date().getHours();
            
            if (hour >= 5 && hour < 12) {
                greetingElement.textContent = 'صباح الخير 👋 | تواصل معي عبر الروابط التالية';
            } else if (hour >= 12 && hour < 18) {
                greetingElement.textContent = 'مرحباً بك 👋 | تواصل معي عبر الروابط التالية';
            } else {
                greetingElement.textContent = 'مساء الخير 👋 | تواصل معي عبر الروابط التالية';
            }
        });

        function copyNumber(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('تم نسخ الرقم بنجاح! 📋');
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('تم نسخ الرقم بنجاح! 📋');
            } catch (err) {
                showToast('الرقم: ' + text);
            }
            document.body.removeChild(textarea);
        }

        function shareProfile() {
            if (navigator.share) {
                navigator.share({
                    title: 'yazn - روابط التواصل',
                    text: 'تواصل مع yazn من خلال الرابط التالي:',
                    url: window.location.href
                }).catch(() => {});
            } else {
                copyNumber(window.location.href);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
